name: publish

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stt
        uses: docker/build-push-action@v6
        with:
          context: ./stt
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/stt:${{ github.sha }}
            ghcr.io/${{ github.repository }}/stt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push tts
        uses: docker/build-push-action@v6
        with:
          context: ./tts
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/tts:${{ github.sha }}
            ghcr.io/${{ github.repository }}/tts:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mock-api
        uses: docker/build-push-action@v6
        with:
          context: ./mock-api
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/mock-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/mock-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./voice-gateway
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
            ghcr.io/${{ github.repository }}/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
